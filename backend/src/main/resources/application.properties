spring.application.name=backend

# Hibernate solo valida las entidades contra el esquema real; quien crea/modifica
# tablas es Flyway (src/main/resources/db/migration), nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT_SECRET / JWT_EXPIRATION: mismos nombres que el manual de despliegue
# (Apéndice D) para que Railway los inyecte tal cual en producción. El valor
# por defecto es SOLO para desarrollo local, nunca debe usarse en producción.
jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-cambiar-en-produccion-minimo-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ADMIN_BOOTSTRAP_SECRET: crea el primer Administrador del sistema (ver
# AdministradorService.crearBootstrap) cuando aún no hay nadie con quien
# autenticarse para pasar por el POST /administradores normal. Valor por
# defecto SOLO para desarrollo local, igual que JWT_SECRET -cambiar
# obligatoriamente en Railway antes de desplegar.
admin.bootstrap-secret=${ADMIN_BOOTSTRAP_SECRET:secreto-bootstrap-de-desarrollo-cambiar-en-produccion}

# MAIL_USERNAME / MAIL_PASSWORD: SMTP de Gmail para el correo de bienvenida
# al Miembro de Junta (ver MiembroJuntaCofradiaService). MAIL_PASSWORD es una
# "contraseña de aplicación" de Gmail (myaccount.google.com/apppasswords),
# NUNCA la contraseña normal de la cuenta -Gmail no deja usarla por SMTP con
# verificación en dos pasos activada, que es obligatoria para generarlas.
# Default vacío a propósito: sin credenciales reales el envío fallará, pero
# el arranque en local no debe depender de tenerlas configuradas (a
# diferencia de la BD, que sí tiene contenedor local automático vía
# spring-boot-docker-compose, el correo no tiene equivalente local).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
